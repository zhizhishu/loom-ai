# LOOM Host + Web — run a PREBUILT server image locally.
#
#   LOOM_IMAGE=ghcr.io/<owner>/<repo>-server-candidate:sha-<40-hex> \
#     docker compose up -d
#
# There is intentionally no `build:` section. docker/Dockerfile requires the
# allowlisted staging context produced only by
# .github/workflows/loom-v2-container.yml (the packaged `package/` tree plus
# entrypoint.sh and healthcheck.sh) — this checkout is not that context. The
# image is built and published by that workflow; here it is only run, by an
# immutable `sha-<commit>` tag.
#
# The Server publishes no host port: it listens on loopback (LISTEN below) and
# the `cloudflared` sidecar owns the network namespace the Server joins. The
# ownership runs that way on purpose: cloudflared starts first and holds the
# stable network namespace, and the Server joins it afterwards. A quick tunnel
# URL lives and dies with the cloudflared process, so keeping the namespace on
# cloudflared means the Server can be force-recreated (for a new PUBLIC_ORIGIN,
# a new image, anything) without restarting cloudflared and without the quick
# tunnel URL changing. The quick tunnel is outbound-only, so nothing is
# reachable from the network until that tunnel connects. Only a cloudflared
# restart mints a new URL, so read the current one from the tunnel's own log:
#   docker compose logs cloudflared
# Then put that exact https URL in PUBLIC_ORIGIN and force-recreate the Server
# alone so it accepts the new Origin (cloudflared keeps running, URL unchanged):
#   PUBLIC_ORIGIN=https://<the-assigned-name>.trycloudflare.com docker compose up -d --force-recreate core
# An empty PUBLIC_ORIGIN is passed through as unset (no reverse-proxy origin).
#
# Read the Owner token (created on first start and stored only in
# /data/web-auth.json; the image never accepts or prints a token, so there is
# no token, password or key in this file):
#   docker compose exec core /opt/rovai/rovai-server --data-dir /data token
# Treat that stdout as a secret: do not paste it into logs, issues, URLs or chat.
services:
  core:
    # Required: no default tag, because candidate tags are immutable and
    # commit-specific (there is deliberately no `latest`).
    image: ${LOOM_IMAGE:?set LOOM_IMAGE to the prebuilt LOOM server image tag}
    restart: unless-stopped
    # Joins cloudflared's network namespace instead of getting its own: that is
    # what makes LISTEN=127.0.0.1:8767 below the very socket cloudflared dials.
    # cloudflared owns the namespace and starts first (depends_on below), so
    # this container can be destroyed and recreated freely — e.g.
    # `--force-recreate core` for a new PUBLIC_ORIGIN — while cloudflared keeps
    # running in its untouched namespace and the quick tunnel URL stays valid.
    network_mode: "service:cloudflared"
    depends_on:
      cloudflared:
        condition: service_started
    # No `ports:` here on purpose. The Server speaks plain HTTP on 8767, so it
    # must not be reachable from the network unless TLS or a private network
    # (Tailscale, VPN) sits in front of it; the quick tunnel below is
    # outbound-only and needs no published port. LISTEN keeps the socket on the
    # shared namespace's loopback, which cloudflared reaches at 127.0.0.1:8767.
    environment:
      LISTEN: 127.0.0.1:8767
      # Both optional; an empty value is still passed to the container and the
      # entrypoint treats it as unset (no reverse-proxy origin, VERBOSE off).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      VERBOSE: ${VERBOSE:-}
    # The whole data root, not just the database: rovai.sqlite, mcp.json,
    # skills/, instances/, logs/ and web-auth.json. Back it up while stopped.
    volumes:
      - "loom-data:/data"

  cloudflared:
    # Ephemeral quick tunnel (no account, no token in this file). It only makes
    # outbound connections to Cloudflare and dials the Server over the shared
    # loopback, so no ingress is opened on the host.
    # This service owns the network namespace: it keeps a plain, own network
    # stack (no `network_mode:`) and must not depend on core — core depends on
    # it and joins it. That makes the namespace, and therefore the quick tunnel
    # URL, outlive any number of core recreations; restarting core with a new
    # PUBLIC_ORIGIN leaves this process and its URL alone.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://127.0.0.1:8767

volumes:
  loom-data:
