name: LOOM V2 Linux isolated personal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'crates/rovai-core/**'
      - 'crates/rovai-host/**'
      - 'crates/loom-node/**'
      - 'crates/loom-pi-launcher/**'
      - 'resources/computer/**'
      - 'resources/dsh-runtime/**'
      - 'scripts/package-dsh-runtime.mjs'
      - 'scripts/lib/dsh-runtime-package.test.mjs'
      - 'scripts/package-linux-personal.mjs'
      - 'scripts/package-computer-runtime-linux.mjs'
      - 'scripts/package-office-runtime-linux.sh'
      - 'scripts/manage-loom-personal.sh'
      - 'scripts/start-loom-personal.sh'
      - 'scripts/install-loom-personal.sh'
      - '.github/workflows/loom-v2-e3-linux.yml'
      - 'scripts/lib/linux-personal.test.mjs'
      - 'scripts/node/Connect-LoomNode.sh'
      - 'scripts/node/README-linux.md'

permissions:
  contents: read

concurrency:
  group: loom-v2-e3-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  personal-linux:
    name: LOOM Linux x64 personal preview
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CI: true
      LOOM_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_JOBS: 3
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.LOOM_SOURCE_COMMIT }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux-personal-e3
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Linux personal packaging contract
        run: node --test scripts/lib/linux-personal.test.mjs scripts/lib/dsh-runtime-package.test.mjs
      - name: Install poppler tools for bundled office preview
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Stage portable Linux office runtime
        run: |
          rm -rf resources/runtime/office-linux
          scripts/package-office-runtime-linux.sh resources/runtime/office-linux /tmp/loom-office-download-cache
      - name: Checkout pinned optional Pi Purge source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ZiChuanLan/pi-purge
          ref: d0196ccfd773b0ed342bd2f25372aff65f1a4a53
          path: _artifacts/reference-repos/pi-purge-current
          persist-credentials: false
      - name: Verify and materialize pinned Pi Purge source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _artifacts/reference-repos/pi-purge-current rev-parse HEAD)" = "d0196ccfd773b0ed342bd2f25372aff65f1a4a53"
          python3 -c "from hashlib import sha256; from pathlib import Path; p = Path('_artifacts/reference-repos/pi-purge-current/extensions/pi-purge.ts'); data = p.read_bytes().replace(b'\\r\\n', b'\\n').replace(b'\\n', b'\\r\\n'); assert sha256(data).hexdigest() == '983a3c3cc3011928a33805d84414060729fd2aa81822bc7ba94008943a65d71d', 'Pi Purge source byte pin mismatch'; p.write_bytes(data)"
      - name: Build Linux server preview
        run: node scripts/build-server.mjs --target-key linux-x64 --debug
      - name: Build Linux LOOM helper binaries
        run: cargo +1.97.1 build --locked -p rovai-core -p loom-node -p loom-pi-launcher --bins
      - name: Package the standalone Linux Node kit
        shell: bash
        run: |
          set -euo pipefail
          kit_name="loom-node-linux-${LOOM_SOURCE_COMMIT}"
          test -f target/debug/loom-node
          test -f target/debug/rovai
          bash -n scripts/node/Connect-LoomNode.sh
          staging="out/loom-node-kit"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp target/debug/loom-node "$staging/loom-node"
          cp target/debug/rovai "$staging/rovai"
          cp scripts/node/Connect-LoomNode.sh "$staging/Connect-LoomNode.sh"
          cp scripts/node/README-linux.md "$staging/README.md"
          chmod +x "$staging/loom-node" "$staging/rovai" "$staging/Connect-LoomNode.sh"
          test "$(ls -A "$staging" | wc -l)" -eq 4
          archive="out/${kit_name}.tar.gz"
          rm -f "$archive"
          tar -czf "$archive" -C "$staging" .
          test -f "$archive"

      - name: Upload the standalone Linux Node kit
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loom-node-linux-${{ env.LOOM_SOURCE_COMMIT }}
          path: out/loom-node-linux-${{ env.LOOM_SOURCE_COMMIT }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Verify reviewed computer helper
        run: python3 -m unittest discover -s resources/computer -v
      - name: Install pinned Pi source
        run: |
          mkdir -p out/pi-source
          cp scripts/runtime/pi-source/package.json scripts/runtime/pi-source/package-lock.json out/pi-source/
          cd out/pi-source
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage and verify embedded Linux Pi runtime
        run: |
          node scripts/package-embedded-pi.mjs \
            --source out/pi-source/node_modules/@earendil-works/pi-coding-agent \
            --node "$(readlink -f "$(command -v node)")" \
            --launcher-built target/debug/loom-pi-launcher \
            --destination resources/runtime/pi
          node scripts/package-embedded-pi.mjs --verify --destination resources/runtime/pi
      - name: Stage and verify Linux computer runtime
        run: |
          rm -rf resources/runtime/computer-linux
          node scripts/package-computer-runtime-linux.mjs --destination resources/runtime/computer-linux
          node scripts/package-computer-runtime-linux.mjs --verify --destination resources/runtime/computer-linux
      - name: Stage and verify the self-contained Linux DSH runtime
        run: |
          rm -rf resources/runtime/dsh
          node scripts/package-dsh-runtime.mjs --destination resources/runtime/dsh
          node scripts/package-dsh-runtime.mjs --verify --destination resources/runtime/dsh
          resources/runtime/dsh/dsh --version | grep -qx '0.2.0-rc.2'
      - name: Assemble Linux personal package
        run: |
          mkdir -p out/linux-personal
          node scripts/package-linux-personal.mjs \
            --server-dir out/server/linux-x64 \
            --pi-dir resources/runtime/pi \
            --dsh-dir resources/runtime/dsh \
            --computer-dir resources/runtime/computer-linux \
            --office-dir resources/runtime/office-linux \
            --pi-purge-file _artifacts/reference-repos/pi-purge-current/extensions/pi-purge.ts \
            --binary target/debug/rovai-core \
            --binary target/debug/loom-node \
            --output out/linux-personal/loom-personal-linux-x64 \
            --archive out/linux-personal/loom-personal-linux-x64.tar.gz
      - name: Upload Linux personal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loom-personal-preview-linux-${{ env.LOOM_SOURCE_COMMIT }}
          path: out/linux-personal/loom-personal-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Download byte-for-byte artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf out/linux-personal-download
          mkdir -p out/linux-personal-download
          for attempt in 1 2 3 4 5 6; do
            if gh run download "$GITHUB_RUN_ID" --name "loom-personal-preview-linux-${LOOM_SOURCE_COMMIT}" --dir out/linux-personal-download; then
              break
            fi
            test "$attempt" -lt 6
            sleep 5
          done
          test -f out/linux-personal-download/loom-personal-linux-x64.tar.gz
      - name: Verify delivered Linux package closure
        shell: bash
        run: |
          set -euo pipefail
          test -f out/linux-personal-download/loom-personal-linux-x64.tar.gz
          cmp out/linux-personal/loom-personal-linux-x64.tar.gz out/linux-personal-download/loom-personal-linux-x64.tar.gz
          rm -rf out/linux-personal-verify
          mkdir -p out/linux-personal-verify
          tar -xzf out/linux-personal-download/loom-personal-linux-x64.tar.gz -C out/linux-personal-verify
          node scripts/package-linux-personal.mjs --verify --output out/linux-personal-verify/loom-personal-linux-x64
          grep -q "LOOM_COMPUTER_AGENT_PI_MCP='1'" out/linux-personal-verify/loom-personal-linux-x64/Manage-Loom.sh
          grep -q 'LOOM_COMPUTER_PYTHON=' out/linux-personal-verify/loom-personal-linux-x64/Manage-Loom.sh
          grep -q 'LOOM_COMPUTER_HELPER=' out/linux-personal-verify/loom-personal-linux-x64/Manage-Loom.sh
          grep -q 'LOOM_COMPUTER_AGENT_PYTHON=' out/linux-personal-verify/loom-personal-linux-x64/Manage-Loom.sh
          grep -q 'LOOM_COMPUTER_AGENT_BRIDGE=' out/linux-personal-verify/loom-personal-linux-x64/Manage-Loom.sh
          grep -q 'ROVAI_EMBEDDED_DSH_ROOT' out/linux-personal-verify/loom-personal-linux-x64/Manage-Loom.sh
          test -x out/linux-personal-verify/loom-personal-linux-x64/runtime/dsh/dsh
          test -f out/linux-personal-verify/loom-personal-linux-x64/runtime/dsh/dsh-runtime-bundle.json
          test -x out/linux-personal-verify/loom-personal-linux-x64/runtime/dsh/node/node
          test "$(out/linux-personal-verify/loom-personal-linux-x64/runtime/dsh/dsh --version)" = '0.2.0-rc.2'
          test -x out/linux-personal-verify/loom-personal-linux-x64/runtime/computer/python
          test -f out/linux-personal-verify/loom-personal-linux-x64/runtime/computer/host_desktop.py
          test -f out/linux-personal-verify/loom-personal-linux-x64/runtime/computer/mcp_bridge.py
          test -x out/linux-personal-verify/loom-personal-linux-x64/runtime/office/linux-x64/libreoffice/program/soffice
          test -x out/linux-personal-verify/loom-personal-linux-x64/runtime/office/linux-x64/poppler/bin/pdftoppm
      # Install-only smoke for the delivered archive: unpack the downloaded
      # tar.gz, install it non-interactively with an explicit runtime selection,
      # then assert the recorded install state. Start is attempted once with a
      # bounded wait and always stopped, so nothing keeps the port.
      - name: Smoke install the delivered Linux package and start once
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/loom-personal-install"
          install_dir="$smoke/programs"
          data_dir="$smoke/data"
          port=18818
          pid=''
          cleanup() {
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          # True when something is listening on the loopback port; the fd lives in
          # a subshell so the probe never leaks one into this script.
          port_open() { (exec 3<>"/dev/tcp/127.0.0.1/$1") 2>/dev/null; }
          rm -rf "$smoke"
          mkdir -p "$smoke/unpacked"
          # Unpack the byte-for-byte downloaded archive, never the local build.
          tar -xzf out/linux-personal-download/loom-personal-linux-x64.tar.gz -C "$smoke/unpacked"
          package="$smoke/unpacked/loom-personal-linux-x64"
          test -x "$package/Install-Loom.sh"
          # Redirected stdin: the install must never block on the runtime prompt.
          sh "$package/Install-Loom.sh" \
            --install-dir "$install_dir" --data-dir "$data_dir" --port "$port" \
            --runtimes pi,dsh </dev/null
          # Recorded install state, not just stdout.
          commit="$(cat "$install_dir/.loom-current")"
          test "${#commit}" -eq 40
          test -d "$install_dir/versions/$commit"
          test "$(cat "$install_dir/.loom-runtimes")" = 'pi,deepseek-harness'
          test "$(cat "$install_dir/.loom-data-dir")" = "$data_dir"
          test "$(cat "$install_dir/.loom-port")" = "$port"
          sh "$install_dir/Manage-Loom.sh" --action status --install-dir "$install_dir" | grep -qx 'runtimes=pi,deepseek-harness'
          sh "$install_dir/Manage-Loom.sh" --action status --install-dir "$install_dir" | grep -qx "port=$port"
          # Start once, wait a bounded time for the loopback port, then stop it.
          sh "$install_dir/Start-Loom.sh" >"$smoke/start.log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if port_open "$port"; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat "$smoke/start.log"; echo 'LOOM did not listen on its installed port'; exit 1; fi
          grep -q 'Enabled runtimes: pi,deepseek-harness' "$smoke/start.log"
          grep -q 'Claude runtime: off' "$smoke/start.log"
          cleanup
          pid=''
          # The port must become free again: the smoke must not hold it for later steps.
          released=0
          for _ in $(seq 1 20); do
            if ! port_open "$port"; then released=1; break; fi
            sleep 0.5
          done
          if [ "$released" -ne 1 ]; then echo 'LOOM still holds its port after shutdown'; exit 1; fi
