[package]
name = "loom-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
loom-protocol = { path = "../loom-protocol" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[dev-dependencies]
anyhow = "1"
rovai-host = { path = "../rovai-host" }
rovai-web = { path = "../rovai-web" }
serde_json = "1"
tungstenite = "0.29"

[[test]]
name = "b1_outbound"
harness = false

[[test]]
name = "b2_resume"
harness = false

[[test]]
name = "b3_capability"
harness = false

[[test]]
name = "b4_shim"
harness = false
