[package]
name = "rovai-process-boundary"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
rovai-private-storage = { path = "../rovai-private-storage" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
